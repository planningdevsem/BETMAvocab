<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BETMA Vocabulary Lab</title>
  <meta name="description" content="Tự học từ vựng TOEIC cùng BETMA ENGLISH.">
  <meta name="theme-color" content="#D3222B">

  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header>
    <a class="logo" href="#/" aria-label="BETMA Vocabulary Lab">
      <img src="./logo.png" alt="BETMA ENGLISH">
      <div>
        <b>Vocabulary Lab</b>
        <small>Beginner to Master</small>
      </div>
    </a>

    <nav aria-label="Điều hướng chính">
      <a href="#/" id="n1">Học tập</a>
      <a href="#/review" id="n2">Ôn tập</a>
    </nav>

    <div id="who" class="who"></div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="dlg">
    <p></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn"
        onclick="document.getElementById('dlg').close('no')">
        Hủy
      </button>
      <button class="btn p ok"
        onclick="document.getElementById('dlg').close('ok')">
        OK
      </button>
    </div>
  </dialog>

  <script src="./config.js"></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
